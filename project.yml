name: DarwinCleaner
options:
  bundleIdPrefix: com.darwincleaner
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  DarwinCleaner:
    type: application
    platform: macOS
    sources:
      - path: DarwinCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darwincleaner.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Darwin Cleaner
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Darwin Cleaner contributors"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: DarwinCleaner/DarwinCleaner.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DarwinCleanerTests
      gatherCoverageData: true
  DarwinCleanerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DarwinCleanerTests
    dependencies:
      - target: DarwinCleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.darwincleaner.tests
