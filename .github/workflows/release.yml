name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from the main branch"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.1.0"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: >-
          xcodebuild test
          -project DarwinCleaner.xcodeproj
          -scheme DarwinCleaner
          -destination 'platform=macOS'
          -derivedDataPath .build/TestDerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          xcodebuild build
          -project DarwinCleaner.xcodeproj
          -scheme DarwinCleaner
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath .build/DerivedData
          MARKETING_VERSION="${VERSION#v}"
          CODE_SIGNING_ALLOWED=NO

      - name: Package DMG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x scripts/create-dmg.sh
          scripts/create-dmg.sh ".build/DerivedData/Build/Products/Release/DarwinCleaner.app" "Darwin-Cleaner-${VERSION}.dmg"
          shasum -a 256 "Darwin-Cleaner-${VERSION}.dmg" > "Darwin-Cleaner-${VERSION}.dmg.sha256"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "$VERSION" -m "Darwin Cleaner $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            "Darwin-Cleaner-${VERSION}.dmg" \
            "Darwin-Cleaner-${VERSION}.dmg.sha256" \
            --generate-notes \
            --title "Darwin Cleaner $VERSION"
